name: RC32.1 complete offline installer

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/rc32-1-full-bundle.yml'
      - 'installer/BCVision_RC32_1_Full.iss'
      - 'scripts/verify_rc32_1_full.ps1'
  push:
    branches: [main]
    paths:
      - '.github/workflows/rc32-1-full-bundle.yml'
      - 'installer/BCVision_RC32_1_Full.iss'
      - 'scripts/verify_rc32_1_full.ps1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rc32-1-full-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-verify:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify unchanged application and Runtime contract
        shell: pwsh
        run: |
          git diff --exit-code 3db6b9bf8b35b4607a7c4131d18b45f9785e907f HEAD -- app VERSION FAST_UPDATE_BASE_VERSION RUNTIME_ABI RUNTIME_CONTRACT.json runtime_payload.py launcher.py requirements-lock.txt requirements-ai-lock.txt
          if ($LASTEXITCODE -ne 0) { throw 'Full bundle must contain exactly the released RC32.1 application' }
          python scripts/verify_runtime_contract.py --validate-update-version 2.2.0-rc32.1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Download and authenticate immutable installers
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory bundle_inputs -Force | Out-Null
          $inputs = @(
            @('v2.2.0-rc32','f4094b12cec00ab4c598538bfaa8952849879996','BCVision_RC32_Setup.exe','d332a4e2bb3265314ea34d170f958dc82974ec743deb40c2f16d8a58d1bc4e72'),
            @('v2.2.0-rc32.1','3db6b9bf8b35b4607a7c4131d18b45f9785e907f','BCVision_RC32.1_Update.exe','542c07d4bdfac14050941cdda47277a219da74e97f9f2cfd1c5c19246c3a524f'),
            @('v2.2.0-rc28.1','5032e5a5801af5368af4c85476cbefbd1cd563e1','BCVision_RC28.1_Setup.exe','E64DFCC90D8C9D17742591C7254D7176CB088C60F38C58C5930D42CAA529C2EC')
          )
          foreach ($item in $inputs) {
            $tagSha = gh api "repos/$env:GITHUB_REPOSITORY/commits/$($item[0])" --jq '.sha'
            if ($LASTEXITCODE -ne 0 -or $tagSha.Trim() -ne $item[1]) { throw 'Immutable tag mismatch' }
            gh release download $item[0] --pattern $item[2] --dir bundle_inputs
            if ($LASTEXITCODE -ne 0) { throw 'Installer download failed' }
            $hash = (Get-FileHash "bundle_inputs/$($item[2])" -Algorithm SHA256).Hash
            if ($hash -ne $item[3]) { throw "Immutable installer hash mismatch: $($item[2])" }
            Write-Host "Authenticated $($item[2]): $hash"
          }
      - name: Build single-file complete installer
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { $iscc = "${env:ProgramFiles}\Inno Setup 6\ISCC.exe" }
          & $iscc installer/BCVision_RC32_1_Full.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify clean installation and incompatible upgrade with preserved data
        shell: pwsh
        run: ./scripts/verify_rc32_1_full.ps1
      - name: Prepare verified full installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory release -Force | Out-Null
          Copy-Item setup_output/BCVision_RC32.1_Setup.exe release/
          $hash = (Get-FileHash release/BCVision_RC32.1_Setup.exe -Algorithm SHA256).Hash
          Set-Content release/SHA256SUMS.txt "$hash  BCVision_RC32.1_Setup.exe" -Encoding ascii
          Get-ChildItem release | Select-Object Name,Length
          Get-Content release/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: rc32-1-complete-installer
          path: release/*
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
      - name: Save install verification logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rc32-1-complete-diagnostics
          if-no-files-found: ignore
          retention-days: 7
          path: |
            ${{ runner.temp }}/full-*.json
            ${{ runner.temp }}/full-*.log
            ${{ runner.temp }}/BCVision_RC32.1_*_setup.log

  publish:
    needs: build-and-verify
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 25
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: rc32-1-complete-installer
          path: release
      - name: Require successful exact-commit main validation
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $deadline = [DateTime]::UtcNow.AddMinutes(18)
          do {
            $response = gh api "repos/$env:GITHUB_REPOSITORY/actions/workflows/anpr-tests.yml/runs?head_sha=$env:GITHUB_SHA&event=push&per_page=20" | ConvertFrom-Json
            if ($LASTEXITCODE -ne 0) { throw 'Could not read exact-commit validation' }
            $runs = @($response.workflow_runs | Where-Object { $_.head_sha -eq $env:GITHUB_SHA -and $_.head_branch -eq 'main' })
            if (@($runs | Where-Object { $_.conclusion -eq 'success' }).Count -gt 0) { exit 0 }
            if (@($runs | Where-Object { $_.status -eq 'completed' -and $_.conclusion -ne 'success' }).Count -gt 0) { throw 'Exact-commit main validation failed' }
            Start-Sleep -Seconds 5
          } while ([DateTime]::UtcNow -lt $deadline)
          throw 'Timed out waiting for exact-commit main validation'
      - name: Publish verified full bundle as a separate release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = 'v2.2.0-rc32.1-full1'
          $existing = gh api "repos/$env:GITHUB_REPOSITORY/commits/$tag" --jq '.sha' 2>$null
          $tagExists = $LASTEXITCODE -eq 0
          if ($tagExists -and $existing.Trim() -ne $env:GITHUB_SHA) { throw 'Existing bundle tag targets another commit' }
          $releaseJson = gh release view $tag --repo $env:GITHUB_REPOSITORY --json isDraft 2>$null
          if ($LASTEXITCODE -eq 0) {
            if (-not $tagExists) { throw 'Existing release has no exact tag' }
            if (-not ($releaseJson | ConvertFrom-Json).isDraft) { throw 'Refusing to overwrite a public release' }
          } else {
            $notes = 'Complete offline single-file installer for BC Vision 2.2.0-rc32.1. Contains the SHA-256-pinned RC32 full runtime and RC32.1 updater. Runtime ABI 2; base remains RC32. Verified clean Windows install and RC28.1 upgrade with persistent database, custom storage, media and model markers. Real-camera accuracy is not certified.'
            gh release create $tag --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title 'BC Vision RC32.1 - Complete Installer' --draft --prerelease --notes $notes
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          foreach ($file in Get-ChildItem release -File) {
            gh release upload $tag $file.FullName --repo $env:GITHUB_REPOSITORY --clobber
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          New-Item -ItemType Directory downloaded -Force | Out-Null
          gh release download $tag --repo $env:GITHUB_REPOSITORY --dir downloaded
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          foreach ($file in Get-ChildItem release -File) {
            if ((Get-FileHash $file.FullName).Hash -ne (Get-FileHash "downloaded/$($file.Name)").Hash) { throw 'Published artifact hash mismatch' }
          }
          gh release edit $tag --repo $env:GITHUB_REPOSITORY --draft=false --prerelease
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
