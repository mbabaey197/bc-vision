name: Fast one-click update

# RC29 installs the stable runtime once. A routine release reuses the exact-SHA
# ANPR validation and builds only the small, transactional application update.

on:
  push:
    branches:
      - main
    paths:
      - VERSION
      # Commit-only fallback when workflow dispatch is unavailable.
      - FAST_UPDATE_TRIGGER
  workflow_dispatch:
    inputs:
      verify_base_install:
        description: Run the slower real RC29 Setup-to-fast-update integration
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: fast-update-${{ github.sha }}
  cancel-in-progress: true

jobs:
  build-update:
    runs-on: windows-latest
    timeout-minutes: 4
    permissions:
      contents: read
      statuses: write
    outputs:
      eligible: ${{ steps.metadata.outputs.eligible }}
      sha: ${{ steps.metadata.outputs.sha }}
      version: ${{ steps.metadata.outputs.version }}
      release_label: ${{ steps.metadata.outputs.release_label }}
      base_version: ${{ steps.metadata.outputs.base_version }}
      runtime_abi: ${{ steps.metadata.outputs.runtime_abi }}
      first_fast: ${{ steps.metadata.outputs.first_fast }}
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUTF8: "1"
      UPDATE_SHA: ${{ github.sha }}
      UPDATE_BRANCH: ${{ github.ref_name }}

    steps:
      - name: Publish pending fast-release status
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $target = (
            "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/" +
            "$env:GITHUB_RUN_ID"
          )
          gh api --method POST `
            "repos/$env:GITHUB_REPOSITORY/statuses/$env:UPDATE_SHA" `
            -f state="pending" `
            -f context="bcvision/fast-release" `
            -f description="Fast update build and validation are running" `
            -f target_url=$target | Out-Null
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Checkout exact update commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ env.UPDATE_SHA }}

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Validate immutable base and fast-update metadata
        id: metadata
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          if ($env:UPDATE_BRANCH -ne "main") {
            throw "Fast releases are allowed only from main."
          }
          $version = (Get-Content VERSION -Raw).Trim()
          $baseVersion = (Get-Content FAST_UPDATE_BASE_VERSION -Raw).Trim()
          $runtimeAbi = (Get-Content RUNTIME_ABI -Raw).Trim()
          python scripts\verify_runtime_contract.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($version -eq $baseVersion) {
            "eligible=false" >> $env:GITHUB_OUTPUT
            "sha=$env:UPDATE_SHA" >> $env:GITHUB_OUTPUT
            "version=$version" >> $env:GITHUB_OUTPUT
            "base_version=$baseVersion" >> $env:GITHUB_OUTPUT
            "runtime_abi=$runtimeAbi" >> $env:GITHUB_OUTPUT
            Write-Host (
              "Commit $env:UPDATE_SHA is the immutable full base " +
              "$baseVersion; no fast child release is required."
            )
            exit 0
          }
          python scripts\verify_runtime_contract.py `
            --validate-update-version $version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $tag = "v$baseVersion"
          $baseTagSha = (
            gh api "repos/$env:GITHUB_REPOSITORY/commits/$tag" --jq '.sha'
          ).Trim()
          if ($LASTEXITCODE -ne 0 -or -not $baseTagSha) {
            throw "The immutable full-runtime base tag $tag is missing."
          }
          git merge-base --is-ancestor $baseTagSha $env:UPDATE_SHA
          if ($LASTEXITCODE -ne 0) {
            throw "The update commit does not descend from $tag."
          }

          New-Item -ItemType Directory base-contract -Force | Out-Null
          gh release download $tag `
            --pattern "RUNTIME_CONTRACT.json" `
            --pattern "RUNTIME_CONTRACT_ID.txt" `
            --dir base-contract
          if ($LASTEXITCODE -ne 0) {
            throw "The base release has no immutable runtime metadata."
          }
          $releasedId = (
            Get-Content base-contract\RUNTIME_CONTRACT_ID.txt -Raw
          ).Trim()
          $verifiedReleasedId = (
            python scripts\verify_runtime_contract.py `
              --contract base-contract\RUNTIME_CONTRACT.json `
              --contract-id
          ).Trim()
          $currentId = (
            python scripts\verify_runtime_contract.py --contract-id
          ).Trim()
          if (
            $releasedId -ne $verifiedReleasedId -or
            $releasedId -ne $currentId
          ) {
            throw (
              "The current runtime contract differs from the installed " +
              "contract published by $tag. A new full base is required."
            )
          }

          if ($version -notmatch '^(?<base>\d+\.\d+\.\d+)-rc(?<rc>\d+(?:\.\d+)*)$') {
            throw "Unsupported update version: $version"
          }
          $releaseBase = $Matches.base
          $rc = $Matches.rc
          $versionInfo = "$releaseBase.$($rc.Replace('.', ''))"
          $windowsParts = $versionInfo.Split('.') | ForEach-Object { [int]$_ }
          if ($windowsParts | Where-Object { $_ -gt 65535 }) {
            throw "Windows file-version component exceeds 65535."
          }

          $releaseTags = @(
            gh api --paginate `
              "repos/$env:GITHUB_REPOSITORY/releases?per_page=100" `
              --jq '.[].tag_name'
          )
          if ($LASTEXITCODE -ne 0) {
            throw "Existing fast releases could not be enumerated."
          }
          $validFastVersions = @()
          foreach ($releaseTag in $releaseTags) {
            if (-not $releaseTag.StartsWith("$tag.")) { continue }
            $releasedVersion = $releaseTag.Substring(1)
            python -c "import sys; from runtime_payload import validate_fast_update_version; validate_fast_update_version(sys.argv[1], sys.argv[2])" `
              $baseVersion $releasedVersion 2>$null
            if ($LASTEXITCODE -eq 0) {
              $validFastVersions += $releasedVersion
            } else {
              Write-Host "Ignoring invalid fast release tag $releaseTag"
            }
          }

          $candidateTag = "v$version"
          $candidateTagSha = (
            gh api `
              "repos/$env:GITHUB_REPOSITORY/commits/$candidateTag" `
              --jq '.sha' 2>$null
          )
          $candidateTagExists = $LASTEXITCODE -eq 0
          if ($candidateTagExists -and
              $candidateTagSha.Trim() -ne $env:UPDATE_SHA) {
            throw (
              "Existing tag $candidateTag targets a different commit; " +
              "exact-tag resume is refused."
            )
          }
          if ($version -in $validFastVersions) {
            if (-not $candidateTagExists) {
              throw (
                "Existing release $candidateTag has no resolvable exact tag."
              )
            }
          }
          foreach ($releasedVersion in $validFastVersions) {
            if ($releasedVersion -eq $version) { continue }
            python scripts\verify_runtime_contract.py `
              --validate-update-version $version `
              --require-newer-than $releasedVersion
            if ($LASTEXITCODE -ne 0) {
              throw (
                "Candidate $version is not newer than existing fast " +
                "release $releasedVersion."
              )
            }
          }

          $firstFast = if ($validFastVersions.Count -eq 0) {
            "true"
          } else {
            "false"
          }
          "eligible=true" >> $env:GITHUB_OUTPUT
          "sha=$env:UPDATE_SHA" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT
          "release_label=RC$rc" >> $env:GITHUB_OUTPUT
          "version_info=$versionInfo" >> $env:GITHUB_OUTPUT
          "runtime_abi=$runtimeAbi" >> $env:GITHUB_OUTPUT
          "runtime_contract=$releasedId" >> $env:GITHUB_OUTPUT
          "base_version=$baseVersion" >> $env:GITHUB_OUTPUT
          "first_fast=$firstFast" >> $env:GITHUB_OUTPUT
          # Missing candidate tags are expected for new fast releases.
          exit 0

      - name: Build and size-check verified application payload
        if: steps.metadata.outputs.eligible == 'true'
        shell: pwsh
        run: |
          python scripts\build_runtime_payload.py --output fast_update_payload
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $payload = "fast_update_payload\${{ steps.metadata.outputs.version }}"
          $payloadBytes = (
            Get-ChildItem $payload -File -Recurse |
              Measure-Object Length -Sum
          ).Sum
          if ($payloadBytes -gt 10MB) {
            throw "Payload is $payloadBytes bytes; use a full release above 10 MiB."
          }
          Write-Host "Verified payload size: $payloadBytes bytes"

      - name: Install Inno Setup
        if: steps.metadata.outputs.eligible == 'true'
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build transactional one-click updater
        if: steps.metadata.outputs.eligible == 'true'
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            $iscc = "${env:ProgramFiles}\Inno Setup 6\ISCC.exe"
          }
          & $iscc `
            "/DMyAppVersion=${{ steps.metadata.outputs.version }}" `
            "/DMyVersionInfo=${{ steps.metadata.outputs.version_info }}" `
            "/DMyReleaseLabel=${{ steps.metadata.outputs.release_label }}" `
            "/DMyRuntimeAbi=${{ steps.metadata.outputs.runtime_abi }}" `
            "/DMyRuntimeContract=${{ steps.metadata.outputs.runtime_contract }}" `
            "/DMyBaseVersion=${{ steps.metadata.outputs.base_version }}" `
            installer\BCVision_Fast_Update.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Create updater-only release files and checksums
        if: steps.metadata.outputs.eligible == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $label = "${{ steps.metadata.outputs.release_label }}"
          New-Item -ItemType Directory release -Force | Out-Null
          $update = Resolve-Path "setup_output\BCVision_${label}_Update.exe"
          if ((Get-Item $update).Length -gt 15MB) {
            throw "Fast updater exceeds the 15 MiB release budget."
          }
          Copy-Item $update release
          $lines = foreach ($file in Get-ChildItem release -File) {
            $hash = (Get-FileHash $file.FullName -Algorithm SHA256).Hash
            "$hash  $($file.Name)"
          }
          Set-Content release\SHA256SUMS.txt $lines -Encoding ascii
          Get-ChildItem release | Select-Object Name,Length

      - name: Upload verified fast-release files
        if: steps.metadata.outputs.eligible == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: fast-update-release
          path: release/*
          if-no-files-found: error
          retention-days: 1

  validation-gate:
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
    env:
      UPDATE_SHA: ${{ github.sha }}
      UPDATE_BRANCH: ${{ github.ref_name }}

    steps:
      - name: Checkout exact update metadata
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            VERSION
            FAST_UPDATE_BASE_VERSION
          sparse-checkout-cone-mode: false
          persist-credentials: false
          ref: ${{ env.UPDATE_SHA }}

      - name: Wait for successful exact-SHA ANPR validation
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          if ($env:UPDATE_BRANCH -ne "main") {
            throw "Fast releases are allowed only from main."
          }
          $version = (Get-Content VERSION -Raw).Trim()
          $baseVersion = (Get-Content FAST_UPDATE_BASE_VERSION -Raw).Trim()
          if ($version -eq $baseVersion) {
            Write-Host "Full base $baseVersion needs no fast-release gate."
            exit 0
          }
          $deadline = [DateTime]::UtcNow.AddMinutes(18)
          $endpoint = (
            "repos/$env:GITHUB_REPOSITORY/actions/workflows/" +
            "anpr-tests.yml/runs?head_sha=$env:UPDATE_SHA" +
            "&event=push&per_page=20"
          )
          do {
            $response = gh api $endpoint | ConvertFrom-Json
            if ($LASTEXITCODE -ne 0) {
              throw "Exact-SHA ANPR status could not be read."
            }
            $runs = @(
              $response.workflow_runs | Where-Object {
                $_.head_sha -eq $env:UPDATE_SHA -and
                $_.head_branch -eq "main"
              }
            )
            $successful = @(
              $runs | Where-Object {
                $_.status -eq "completed" -and
                $_.conclusion -eq "success"
              }
            )
            if ($successful.Count -gt 0) {
              Write-Host "Using successful ANPR run $($successful[0].html_url)"
              exit 0
            }
            $failed = @(
              $runs | Where-Object {
                $_.status -eq "completed" -and
                $_.conclusion -ne "success"
              }
            )
            if ($failed.Count -gt 0) {
              throw "Exact-SHA ANPR validation failed: $($failed[0].html_url)"
            }
            Start-Sleep -Seconds 5
          } while ([DateTime]::UtcNow -lt $deadline)
          throw (
            "Exact-SHA ANPR validation did not finish within 18 minutes. " +
            "No update was published."
          )

  base-integration:
    needs: build-update
    if: >-
      needs.build-update.outputs.eligible == 'true' &&
      (needs.build-update.outputs.first_fast == 'true' ||
       inputs.verify_base_install == true)
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
    env:
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      - name: Checkout exact update commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ needs.build-update.outputs.sha }}

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Download full base Setup and fast updater
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory base -Force | Out-Null
          $baseVersion = "${{ needs.build-update.outputs.base_version }}"
          $baseRc = ($baseVersion -split '-rc', 2)[1]
          gh release download "v$baseVersion" `
            --pattern "BCVision_RC${baseRc}_Setup.exe" `
            --dir base
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Download verified updater artifact
        uses: actions/download-artifact@v4
        with:
          name: fast-update-release
          path: release

      - name: Verify real base Setup to transactional fast update
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $installDir = Join-Path $env:RUNNER_TEMP "bcvision-fast-real"
          $bootstrapDir = Join-Path $env:RUNNER_TEMP "bcvision-bootstrap"
          $customData = Join-Path $env:RUNNER_TEMP "bcvision-custom-data"
          New-Item -ItemType Directory $bootstrapDir,$customData -Force |
            Out-Null
          @{storage_root=$customData} | ConvertTo-Json |
            Set-Content (Join-Path $bootstrapDir "storage_config.json") `
              -Encoding utf8
          $configHash = (
            Get-FileHash (Join-Path $bootstrapDir "storage_config.json")
          ).Hash

          $setup = Resolve-Path "base\BCVision_*_Setup.exe"
          $installed = Start-Process $setup -ArgumentList @(
            "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART",
            "/DIR=$installDir"
          ) -Wait -PassThru
          if ($installed.ExitCode -ne 0) {
            throw "Base Setup exited with $($installed.ExitCode)"
          }
          $baseResult = Join-Path $env:RUNNER_TEMP "base-self-test.json"
          $baseTest = Start-Process "$installDir\BCVision.exe" -ArgumentList @(
            "--self-test", "--self-test-data-dir", $bootstrapDir,
            "--self-test-output", $baseResult
          ) -Wait -PassThru
          if ($baseTest.ExitCode -ne 0) { throw "Base self-test failed" }
          $baseJson = Get-Content $baseResult -Raw | ConvertFrom-Json
          if (
            $baseJson.runtime_version -ne
              "${{ needs.build-update.outputs.base_version }}"
          ) { throw "Base runtime version is incorrect" }

          $env:BCVISION_TEST_MARKER = "preserve-$([guid]::NewGuid())"
          $env:BCVISION_TEST_DB = Join-Path $customData "bcvision.db"
          python -c "import os,sqlite3; c=sqlite3.connect(os.environ['BCVISION_TEST_DB']); c.execute('INSERT OR REPLACE INTO settings(key,value) VALUES(?,?)',('fast_update_marker',os.environ['BCVISION_TEST_MARKER'])); c.commit(); c.close()"
          $persistentMarkers = @(
            "videos\preserve.marker",
            "snapshots\preserve.marker",
            "plates\preserve.marker",
            "models\plate\preserve-yolo11n.marker",
            "models\plate\preserve-yolov8n.marker"
          )
          foreach ($relative in $persistentMarkers) {
            $path = Join-Path $customData $relative
            New-Item -ItemType Directory (Split-Path $path) -Force |
              Out-Null
            Set-Content $path $env:BCVISION_TEST_MARKER
          }

          $update = Resolve-Path "release\BCVision_*_Update.exe"
          $updated = Start-Process $update -ArgumentList @(
            "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART",
            "/DIR=$installDir"
          ) -Wait -PassThru
          if ($updated.ExitCode -ne 0) {
            throw "Fast updater exited with $($updated.ExitCode)"
          }
          $updatedResult = Join-Path $env:RUNNER_TEMP "updated-self-test.json"
          $updatedTest = Start-Process "$installDir\BCVision.exe" `
            -ArgumentList @(
              "--self-test", "--self-test-data-dir", $bootstrapDir,
              "--self-test-output", $updatedResult
            ) -Wait -PassThru
          if ($updatedTest.ExitCode -ne 0) { throw "Updated self-test failed" }
          $updatedJson = Get-Content $updatedResult -Raw | ConvertFrom-Json
          if (
            $updatedJson.runtime_version -ne
              "${{ needs.build-update.outputs.version }}" -or
            $updatedJson.runtime_source -ne "external"
          ) { throw "Fast runtime was not activated by the installed EXE" }
          python scripts\verify_installed_runtime.py `
            --install-dir $installDir `
            --version "${{ needs.build-update.outputs.version }}" `
            --abi "${{ needs.build-update.outputs.runtime_abi }}" `
            --previous "${{ needs.build-update.outputs.base_version }}" `
            --last-known-good "${{ needs.build-update.outputs.version }}"

          if ((Get-FileHash (
            Join-Path $bootstrapDir "storage_config.json"
          )).Hash -ne $configHash) { throw "Storage configuration changed" }
          python -c "import os,sqlite3,sys; c=sqlite3.connect(os.environ['BCVISION_TEST_DB']); r=c.execute('SELECT value FROM settings WHERE key=?',('fast_update_marker',)).fetchone(); c.close(); sys.exit(0 if r and r[0]==os.environ['BCVISION_TEST_MARKER'] else 1)"
          if ($LASTEXITCODE -ne 0) { throw "Database setting was not preserved" }
          foreach ($relative in $persistentMarkers) {
            $markerPath = Join-Path $customData $relative
            if (
              -not (Test-Path $markerPath) -or
              (Get-Content $markerPath -Raw).Trim() -ne
                $env:BCVISION_TEST_MARKER
            ) {
              throw "Persistent marker changed or missing: $relative"
            }
          }

          # Re-running the immutable full RC29 Setup must repair base files
          # without downgrading the already-confirmed fast runtime.
          $repair = Start-Process $setup -ArgumentList @(
            "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART",
            "/DIR=$installDir"
          ) -Wait -PassThru
          if ($repair.ExitCode -ne 0) {
            throw "Full RC29 repair exited with $($repair.ExitCode)"
          }
          $repairResult = Join-Path $env:RUNNER_TEMP "repair-self-test.json"
          $repairTest = Start-Process "$installDir\BCVision.exe" `
            -ArgumentList @(
              "--self-test", "--self-test-data-dir", $bootstrapDir,
              "--self-test-output", $repairResult
            ) -Wait -PassThru
          if ($repairTest.ExitCode -ne 0) {
            throw "Runtime failed after full RC29 repair"
          }
          $repairJson = Get-Content $repairResult -Raw | ConvertFrom-Json
          if (
            $repairJson.runtime_version -ne
              "${{ needs.build-update.outputs.version }}" -or
            $repairJson.runtime_source -ne "external"
          ) { throw "Full RC29 repair downgraded the active fast runtime" }
          python scripts\verify_installed_runtime.py `
            --install-dir $installDir `
            --version "${{ needs.build-update.outputs.version }}" `
            --abi "${{ needs.build-update.outputs.runtime_abi }}" `
            --previous "${{ needs.build-update.outputs.base_version }}" `
            --last-known-good "${{ needs.build-update.outputs.version }}"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ((Get-FileHash (
            Join-Path $bootstrapDir "storage_config.json"
          )).Hash -ne $configHash) {
            throw "Full RC29 repair changed storage configuration"
          }
          python -c "import os,sqlite3,sys; c=sqlite3.connect(os.environ['BCVISION_TEST_DB']); r=c.execute('SELECT value FROM settings WHERE key=?',('fast_update_marker',)).fetchone(); c.close(); sys.exit(0 if r and r[0]==os.environ['BCVISION_TEST_MARKER'] else 1)"
          if ($LASTEXITCODE -ne 0) {
            throw "Full RC29 repair changed the database setting"
          }
          foreach ($relative in $persistentMarkers) {
            $markerPath = Join-Path $customData $relative
            if (
              -not (Test-Path $markerPath) -or
              (Get-Content $markerPath -Raw).Trim() -ne
                $env:BCVISION_TEST_MARKER
            ) { throw "Full RC29 repair changed $relative" }
          }

  publish:
    needs:
      - build-update
      - base-integration
      - validation-gate
    if: always()
    runs-on: windows-latest
    timeout-minutes: 1
    permissions:
      actions: read
      contents: write

    steps:
      - name: Download verified fast-release files
        if: >-
          needs.build-update.result == 'success' &&
          needs.validation-gate.result == 'success' &&
          needs.build-update.outputs.eligible == 'true' &&
          (needs.base-integration.result == 'success' ||
           needs.base-integration.result == 'skipped')
        uses: actions/download-artifact@v4
        with:
          name: fast-update-release
          path: release

      - name: Publish or safely resume the exact-SHA release
        id: release
        if: >-
          needs.build-update.result == 'success' &&
          needs.validation-gate.result == 'success' &&
          needs.build-update.outputs.eligible == 'true' &&
          (needs.base-integration.result == 'success' ||
           needs.base-integration.result == 'skipped')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $ErrorActionPreference = "Stop"
          function Assert-ExactReleaseAssets(
            [string] $ReleaseTag,
            [string[]] $ExpectedNames
          ) {
            $verifyDir = Join-Path $env:RUNNER_TEMP "fast-release-verify"
            Remove-Item $verifyDir -Recurse -Force -ErrorAction SilentlyContinue
            New-Item -ItemType Directory $verifyDir -Force | Out-Null
            gh release download $ReleaseTag --dir $verifyDir
            if ($LASTEXITCODE -ne 0) {
              throw "Release $ReleaseTag assets could not be downloaded."
            }
            $downloadedNames = @(
              Get-ChildItem $verifyDir -File | ForEach-Object { $_.Name }
            )
            $unexpected = @(
              $downloadedNames | Where-Object { $_ -notin $ExpectedNames }
            )
            $missing = @(
              $ExpectedNames | Where-Object { $_ -notin $downloadedNames }
            )
            if ($unexpected.Count -ne 0 -or $missing.Count -ne 0) {
              throw "Release $ReleaseTag has an unexpected asset set."
            }
            $localChecksums = Resolve-Path "release\SHA256SUMS.txt"
            $remoteChecksums = Join-Path $verifyDir "SHA256SUMS.txt"
            if ((Get-FileHash $localChecksums -Algorithm SHA256).Hash -ne
                (Get-FileHash $remoteChecksums -Algorithm SHA256).Hash) {
              throw "Release $ReleaseTag checksum metadata is not exact-SHA."
            }
            foreach ($name in $ExpectedNames) {
              if ($name -eq "SHA256SUMS.txt") { continue }
              $escaped = [regex]::Escape($name)
              $line = Get-Content $remoteChecksums | Where-Object {
                $_ -match "^(?<hash>[0-9a-fA-F]{64})\s+\*?$escaped$"
              } | Select-Object -First 1
              $checksumMatch = [regex]::Match(
                [string]$line,
                "^(?<hash>[0-9a-fA-F]{64})"
              )
              if (-not $checksumMatch.Success) {
                throw "Release checksum is missing $name."
              }
              $actual = (
                Get-FileHash (Join-Path $verifyDir $name) -Algorithm SHA256
              ).Hash
              if ($actual -ne $checksumMatch.Groups['hash'].Value) {
                throw "Release asset $name failed SHA-256 verification."
              }
            }
          }

          $tag = "v${{ needs.build-update.outputs.version }}"
          $sha = "${{ needs.build-update.outputs.sha }}"
          $repository = "$env:GITHUB_REPOSITORY"
          $tagRefJson = gh api `
            "repos/$repository/git/ref/tags/$tag" 2>$null
          $tagExists = $LASTEXITCODE -eq 0
          if ($tagExists) {
            $commitJson = gh api "repos/$repository/commits/$tag"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $tagSha = ($commitJson | ConvertFrom-Json).sha
            if ($tagSha -ne $sha) {
              throw "Existing tag $tag targets $tagSha instead of $sha."
            }
          }

          $releaseJson = gh release view $tag --json isDraft,assets 2>$null
          $releaseExists = $LASTEXITCODE -eq 0
          if ($releaseExists -and -not $tagExists) {
            throw (
              "Existing release $tag has no resolvable exact tag; " +
              "exact-SHA resume is refused."
            )
          }
          if ($releaseExists) {
            $release = $releaseJson | ConvertFrom-Json
            $assetNames = @($release.assets | ForEach-Object { $_.name })
            $expected = @(
              "BCVision_${{ needs.build-update.outputs.release_label }}_Update.exe",
              "SHA256SUMS.txt"
            )
            $missing = @($expected | Where-Object { $_ -notin $assetNames })
            if (-not $release.isDraft) {
              if ($missing.Count -ne 0) {
                throw (
                  "Public release $tag is incomplete. Refusing to mutate " +
                  "a published release; create a new version instead."
                )
              }
              Assert-ExactReleaseAssets $tag $expected
              Write-Host "Exact-SHA release is already complete: $tag"
              exit 0
            }
          } else {
            $arguments = @(
              "release", "create", $tag,
              "--title", "BC Vision ${{ needs.build-update.outputs.version }}",
              "--prerelease", "--draft", "--generate-notes"
            )
            if ($tagExists) {
              $arguments += "--verify-tag"
            } else {
              $arguments += @("--target", $sha)
            }
            & gh @arguments
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

          foreach ($file in Get-ChildItem release -File) {
            gh release upload $tag $file.FullName --clobber
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          $verified = gh release view $tag --json assets |
            ConvertFrom-Json
          $verifiedNames = @($verified.assets | ForEach-Object { $_.name })
          $expected = @(
            "BCVision_${{ needs.build-update.outputs.release_label }}_Update.exe",
            "SHA256SUMS.txt"
          )
          $missing = @($expected | Where-Object { $_ -notin $verifiedNames })
          if ($missing.Count -ne 0) {
            throw "Release is incomplete: $($missing -join ', ')"
          }
          Assert-ExactReleaseAssets $tag $expected
          gh release edit $tag --draft=false --prerelease
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  publish-status:
    needs:
      - build-update
      - validation-gate
      - base-integration
      - publish
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      statuses: write

    steps:
      - name: Publish final fast-release status
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          $eligible = "${{ needs.build-update.outputs.eligible }}"
          $buildResult = "${{ needs.build-update.result }}"
          $validationResult = "${{ needs.validation-gate.result }}"
          $baseIntegrationResult = "${{ needs.base-integration.result }}"
          $publishResult = "${{ needs.publish.result }}"
          $noChildRequired = (
            $eligible -eq "false" -and
            $buildResult -eq "success" -and
            $validationResult -eq "success" -and
            $baseIntegrationResult -eq "skipped" -and
            $publishResult -eq "success"
          )
          $publishedFastChild = (
            $eligible -eq "true" -and
            $buildResult -eq "success" -and
            $validationResult -eq "success" -and
            (
              $baseIntegrationResult -eq "success" -or
              $baseIntegrationResult -eq "skipped"
            ) -and
            $publishResult -eq "success"
          )
          if ($noChildRequired) {
            $state = "success"
            $description = "No fast child release is required for this commit"
          } elseif ($publishedFastChild) {
            $state = "success"
            $description = "Transactional fast update published and verified"
          } else {
            $state = "failure"
            $description = "Fast update failed or exceeded its runner budget"
          }
          $sha = "${{ needs.build-update.outputs.sha || github.sha }}"
          $target = (
            "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/" +
            "$env:GITHUB_RUN_ID"
          )
          gh api --method POST `
            "repos/$env:GITHUB_REPOSITORY/statuses/$sha" `
            -f state=$state `
            -f context="bcvision/fast-release" `
            -f description=$description `
            -f target_url=$target | Out-Null
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
