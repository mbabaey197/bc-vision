name: RC25 license manager release

# One-time publisher for the owner's offline BC Vision license manager.
# The Ed25519 private key is intentionally never checked out or bundled.

on:
  workflow_dispatch:
  push:
    branches:
      - agent/anpr-detection-recovery-rc25
    paths:
      - ".github/workflows/rc25-license-manager-release.yml"

permissions:
  contents: write
  statuses: write

concurrency:
  group: rc25-license-manager-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-publish:
    runs-on: windows-2025
    timeout-minutes: 30

    steps:
      - name: Checkout exact candidate commit
        uses: actions/checkout@v4

      - name: Report license-manager run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: powershell
        run: |
          $target = "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
          gh api --method POST "repos/$env:GITHUB_REPOSITORY/statuses/$env:GITHUB_SHA" -f state=pending -f context=rc25-license-manager -f description="RC25 license manager is building" -f target_url=$target
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install pinned build dependencies
        shell: powershell
        run: |
          python -m pip install --disable-pip-version-check pyinstaller==6.21.0 cryptography==49.0.0 pytest==9.0.2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Test license format and manager service
        shell: powershell
        run: |
          python -m pytest -q tests/test_license.py tests/test_license_manager.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify private key is absent
        shell: powershell
        run: |
          if (Test-Path "tools\keys\license_private_key.pem") {
            throw "Private licensing key must never enter GitHub Actions or release assets"
          }

      - name: Build standalone Windows license manager
        shell: powershell
        run: |
          python -m PyInstaller --noconfirm --clean --windowed --onefile --name BCVision_License_Manager_v2.2.0-rc25 --paths . --hidden-import tools.license_service --hidden-import app.license_format --add-data "license_public_key.pem;." tools/license_manager.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path "dist\BCVision_License_Manager_v2.2.0-rc25.exe")) {
            throw "License manager executable was not created"
          }

      - name: Smoke-test Windows GUI
        shell: powershell
        run: |
          $exe = Resolve-Path "dist\BCVision_License_Manager_v2.2.0-rc25.exe"
          $resourceTest = Start-Process -FilePath $exe -ArgumentList "--self-test" -Wait -PassThru
          if ($resourceTest.ExitCode -ne 0) {
            throw "Bundled public key self-test failed with code $($resourceTest.ExitCode)"
          }
          $process = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 8
          if ($process.HasExited) {
            throw "License manager exited during GUI smoke test with code $($process.ExitCode)"
          }
          Stop-Process -Id $process.Id -Force
          Wait-Process -Id $process.Id -ErrorAction SilentlyContinue

      - name: Create SHA-256 checksum
        shell: powershell
        run: |
          $exe = Get-Item "dist\BCVision_License_Manager_v2.2.0-rc25.exe"
          $hash = (Get-FileHash $exe.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -Path "dist\BCVision_License_Manager_v2.2.0-rc25.exe.sha256" -Value "$hash  $($exe.Name)" -Encoding ascii
          Get-Content "dist\BCVision_License_Manager_v2.2.0-rc25.exe.sha256"
          Write-Host "SIZE=$($exe.Length)"

      - name: Publish to RC25 GitHub prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: powershell
        run: |
          gh release upload v2.2.0-rc25 "dist\BCVision_License_Manager_v2.2.0-rc25.exe" "dist\BCVision_License_Manager_v2.2.0-rc25.exe.sha256" --clobber --repo $env:GITHUB_REPOSITORY
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Report license-manager success
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: powershell
        run: |
          $target = "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/releases/tag/v2.2.0-rc25"
          gh api --method POST "repos/$env:GITHUB_REPOSITORY/statuses/$env:GITHUB_SHA" -f state=success -f context=rc25-license-manager -f description="RC25 license manager published" -f target_url=$target
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Report license-manager failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: powershell
        run: |
          $target = "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
          gh api --method POST "repos/$env:GITHUB_REPOSITORY/statuses/$env:GITHUB_SHA" -f state=failure -f context=rc25-license-manager -f description="RC25 license manager build failed" -f target_url=$target
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
