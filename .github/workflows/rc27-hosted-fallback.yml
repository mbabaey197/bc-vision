name: RC27.1 Hosted Fallback Build

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - ".github/rc27-hosted-trigger.txt"

permissions:
  contents: read
  actions: write

concurrency:
  group: rc27-hosted-fallback
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 120

    env:
      PYTHONUTF8: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      BCVISION_HEZAR_OCR: "1"
      BCVISION_EXPERIMENTAL_NO_LICENSE: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Build application with bundled Hezar OCR
        shell: cmd
        run: |
          call BUILD_PORTABLE_EXE.bat

      - name: Install Inno Setup
        shell: powershell
        run: |
          $cmd = Get-Command iscc.exe -ErrorAction SilentlyContinue
          if (-not $cmd) { choco install innosetup --no-progress -y }

      - name: Build installer and updater
        shell: powershell
        run: |
          $candidates = @()
          $cmd = Get-Command iscc.exe -ErrorAction SilentlyContinue
          if ($cmd) { $candidates += $cmd.Source }
          $candidates += "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          $candidates += "$env:ProgramFiles\Inno Setup 6\ISCC.exe"
          $iscc = $candidates | Where-Object { $_ -and (Test-Path $_) } | Select-Object -First 1
          if (-not $iscc) { throw "ISCC.exe not found after installation." }
          New-Item -ItemType Directory -Force -Path setup_output | Out-Null
          & $iscc installer\BCVision.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $iscc installer\BCVision_Update.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify and normalize RC27.1 outputs
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Write-Host '--- Executables produced by build ---'
          Get-ChildItem -Path dist,setup_output -Recurse -File -Filter *.exe -ErrorAction SilentlyContinue |
            Select-Object FullName,Length,LastWriteTime | Format-Table -AutoSize

          $appExe = Get-Item 'dist\BCVision\BCVision.exe' -ErrorAction Stop
          if ($appExe.Length -le 0) { throw 'BCVision.exe is empty.' }

          $setupCandidates = @(Get-ChildItem 'setup_output' -File -Filter '*.exe' | Where-Object { $_.BaseName -match '(?i)setup' })
          $updateCandidates = @(Get-ChildItem 'setup_output' -File -Filter '*.exe' | Where-Object { $_.BaseName -match '(?i)update|updater' })
          if ($setupCandidates.Count -lt 1) { throw 'No setup EXE was produced by Inno Setup.' }
          if ($updateCandidates.Count -lt 1) { throw 'No update EXE was produced by Inno Setup.' }

          $setup = $setupCandidates | Sort-Object Length -Descending | Select-Object -First 1
          $update = $updateCandidates | Sort-Object Length -Descending | Select-Object -First 1
          if ($setup.Length -le 0) { throw 'Setup EXE is empty.' }
          if ($update.Length -le 0) { throw 'Update EXE is empty.' }

          $hezarModel = Get-ChildItem 'dist\BCVision' -Recurse -File -Filter 'model.pt' |
            Where-Object { $_.FullName -match '(?i)hezar-model' } |
            Sort-Object Length -Descending |
            Select-Object -First 1
          if (-not $hezarModel) {
            Write-Host '--- model.pt files found ---'
            Get-ChildItem 'dist\BCVision' -Recurse -File -Filter 'model.pt' -ErrorAction SilentlyContinue |
              Select-Object FullName,Length | Format-Table -AutoSize
            throw 'Bundled Hezar model.pt was not found anywhere in the packaged application.'
          }
          if ($hezarModel.Length -le 1000000) { throw "Bundled Hezar model is unexpectedly small: $($hezarModel.Length) bytes" }

          $releaseDir = 'release_rc27_1'
          Remove-Item $releaseDir -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $releaseDir | Out-Null
          Copy-Item $setup.FullName "$releaseDir\BCVision_RC27.1_Setup.exe" -Force
          Copy-Item $update.FullName "$releaseDir\BCVision_RC27.1_Update.exe" -Force

          $required = @(
            "$releaseDir\BCVision_RC27.1_Setup.exe",
            "$releaseDir\BCVision_RC27.1_Update.exe"
          )
          foreach ($item in $required) {
            $file = Get-Item $item -ErrorAction Stop
            if ($file.Length -le 0) { throw "Empty normalized output: $item" }
          }

          Write-Host '--- Verified RC27.1 outputs ---'
          Get-Item $required | Select-Object FullName,Length,LastWriteTime | Format-Table -AutoSize
          Write-Host "Hezar model: $($hezarModel.FullName) ($($hezarModel.Length) bytes)"

      - name: Upload RC27.1 bundle
        uses: actions/upload-artifact@v4
        with:
          name: BCVision-RC27.1-Hezar-Windows-Hosted
          path: |
            release_rc27_1/BCVision_RC27.1_Setup.exe
            release_rc27_1/BCVision_RC27.1_Update.exe
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
