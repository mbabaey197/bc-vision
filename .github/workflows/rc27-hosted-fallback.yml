name: Windows Hosted Build and Release

# Trusted main/manual release trigger.
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "VERSION"
      - "BUILD_PORTABLE_EXE.bat"
      - "requirements-lock.txt"
      - "requirements-ai-lock.txt"
      - "installer/BCVision.iss"
      - "installer/BCVision_Update.iss"
      - ".github/workflows/rc27-hosted-fallback.yml"
      - "app/**"

permissions:
  contents: write

concurrency:
  group: rc27-hosted-release-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 120

    env:
      PYTHONUTF8: "1"
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Read source version
        id: version
        shell: powershell
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          if ($version -notmatch '^\d+\.\d+\.\d+-rc(?<rc>\d+(?:\.\d+)*)$') {
            throw "Unsupported VERSION: $version"
          }
          "value=$version" >> $env:GITHUB_OUTPUT
          "label=RC$($Matches.rc)" >> $env:GITHUB_OUTPUT

      - name: Build application with bundled Hezar OCR
        shell: cmd
        run: |
          call BUILD_PORTABLE_EXE.bat

      - name: Install Inno Setup
        shell: powershell
        run: |
          $cmd = Get-Command iscc.exe -ErrorAction SilentlyContinue
          if (-not $cmd) { choco install innosetup --no-progress -y }

      - name: Build installer and updater
        shell: powershell
        run: |
          $candidates = @()
          $cmd = Get-Command iscc.exe -ErrorAction SilentlyContinue
          if ($cmd) { $candidates += $cmd.Source }
          $candidates += "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          $candidates += "$env:ProgramFiles\Inno Setup 6\ISCC.exe"
          $iscc = $candidates | Where-Object { $_ -and (Test-Path $_) } | Select-Object -First 1
          if (-not $iscc) { throw "ISCC.exe not found after installation." }
          New-Item -ItemType Directory -Force -Path setup_output | Out-Null
          & $iscc installer\BCVision.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $iscc installer\BCVision_Update.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify release outputs
        shell: powershell
        run: |
          $releaseLabel = "${{ steps.version.outputs.label }}"
          $required = @(
            'dist\BCVision\BCVision.exe',
            "setup_output\BCVision_${releaseLabel}_Setup.exe",
            "setup_output\BCVision_${releaseLabel}_Update.exe"
          )
          foreach ($item in $required) {
            if (-not (Test-Path $item)) { throw "Missing output: $item" }
          }

          $seedRoots = @(
            'dist\BCVision\model-seed',
            'dist\BCVision\_internal\model-seed'
          )
          $seedRoot = $seedRoots | Where-Object { Test-Path $_ -PathType Container } | Select-Object -First 1
          if (-not $seedRoot) {
            Write-Host 'Packaged model diagnostics:'
            Get-ChildItem 'dist\BCVision' -Recurse -File -ErrorAction SilentlyContinue |
              Where-Object { $_.FullName -match 'model-seed|hezar|\.onnx$|model\.pt$' } |
              Select-Object FullName,Length
            throw 'Missing bundled model-seed directory'
          }

          $seedFiles = Get-ChildItem $seedRoot -Recurse -File
          $hezarModel = $seedFiles | Where-Object { $_.Name -eq 'crnn_fa_v2.onnx' } | Select-Object -First 1
          $yoloModel = $seedFiles | Where-Object { $_.Name -eq 'plate_yolo11n.onnx' } | Select-Object -First 1
          if (-not $hezarModel -or $hezarModel.Length -ne 37146355) {
            $seedFiles | Select-Object FullName,Length
            throw 'Bundled Hezar ONNX model is missing or invalid'
          }
          if (-not $yoloModel -or $yoloModel.Length -ne 10481682) {
            $seedFiles | Select-Object FullName,Length
            throw 'Bundled YOLO11n ONNX model is missing or invalid'
          }

          Get-Item $required | Select-Object FullName,Length,LastWriteTime
          $seedFiles | Select-Object FullName,Length,LastWriteTime

      - name: Create source archive and checksums
        shell: powershell
        run: |
          $version = "${{ steps.version.outputs.value }}"
          $releaseLabel = "${{ steps.version.outputs.label }}"
          $source = "setup_output\BC_Vision_v${version}_Source.zip"
          git archive --format=zip --output=$source HEAD
          $files = @(
            "setup_output\BCVision_${releaseLabel}_Setup.exe",
            "setup_output\BCVision_${releaseLabel}_Update.exe",
            $source
          )
          $checksums = foreach ($file in $files) {
            $hash = (Get-FileHash -LiteralPath $file -Algorithm SHA256).Hash
            "$hash  $([IO.Path]::GetFileName($file))"
          }
          Set-Content -LiteralPath 'setup_output\SHA256SUMS.txt' -Value $checksums -Encoding ascii
          Get-Content -LiteralPath 'setup_output\SHA256SUMS.txt'

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.value }}
          target_commitish: ${{ github.sha }}
          name: BC Vision ${{ steps.version.outputs.value }}
          prerelease: true
          generate_release_notes: true
          files: |
            setup_output/BCVision_${{ steps.version.outputs.label }}_Setup.exe
            setup_output/BCVision_${{ steps.version.outputs.label }}_Update.exe
            setup_output/BC_Vision_v${{ steps.version.outputs.value }}_Source.zip
            setup_output/SHA256SUMS.txt
