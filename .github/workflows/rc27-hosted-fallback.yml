name: RC27.1 Hosted Build and Release

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "VERSION"
      - "BUILD_PORTABLE_EXE.bat"
      - "requirements-lock.txt"
      - "requirements-ai-lock.txt"
      - "installer/BCVision.iss"
      - "installer/BCVision_Update.iss"
      - ".github/workflows/rc27-hosted-fallback.yml"
      - "app/**"
  pull_request:
    branches:
      - main
    paths:
      - ".github/rc27-pr-trigger.txt"
      - ".github/workflows/rc27-hosted-fallback.yml"
      - "VERSION"
      - "BUILD_PORTABLE_EXE.bat"
      - "requirements-lock.txt"
      - "requirements-ai-lock.txt"
      - "installer/BCVision.iss"
      - "installer/BCVision_Update.iss"
      - "app/**"

permissions:
  contents: write
  actions: write

concurrency:
  group: rc27-hosted-release-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 120

    env:
      PYTHONUTF8: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      BCVISION_HEZAR_OCR: "1"
      BCVISION_EXPERIMENTAL_NO_LICENSE: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Verify source version
        shell: powershell
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          if ($version -ne "2.2.0-rc27.1") { throw "Unexpected VERSION: $version" }

      - name: Build application with bundled Hezar OCR
        shell: cmd
        run: |
          call BUILD_PORTABLE_EXE.bat

      - name: Install Inno Setup
        shell: powershell
        run: |
          $cmd = Get-Command iscc.exe -ErrorAction SilentlyContinue
          if (-not $cmd) { choco install innosetup --no-progress -y }

      - name: Build installer and updater
        shell: powershell
        run: |
          $candidates = @()
          $cmd = Get-Command iscc.exe -ErrorAction SilentlyContinue
          if ($cmd) { $candidates += $cmd.Source }
          $candidates += "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          $candidates += "$env:ProgramFiles\Inno Setup 6\ISCC.exe"
          $iscc = $candidates | Where-Object { $_ -and (Test-Path $_) } | Select-Object -First 1
          if (-not $iscc) { throw "ISCC.exe not found after installation." }
          New-Item -ItemType Directory -Force -Path setup_output | Out-Null
          & $iscc installer\BCVision.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $iscc installer\BCVision_Update.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify RC27.1 outputs
        shell: powershell
        run: |
          $required = @(
            'dist\BCVision\BCVision.exe',
            'setup_output\BCVision_RC27.1_Setup.exe',
            'setup_output\BCVision_RC27.1_Update.exe'
          )
          foreach ($item in $required) { if (-not (Test-Path $item)) { throw "Missing output: $item" } }
          $hezarCandidates = @(
            'dist\BCVision\hezar-model\model.pt',
            'dist\BCVision\_internal\hezar-model\model.pt'
          )
          $hezarModel = $hezarCandidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $hezarModel) { throw "Missing bundled Hezar model" }
          Get-Item $required, $hezarModel | Select-Object FullName,Length,LastWriteTime

      - name: Upload RC27.1 bundle
        uses: actions/upload-artifact@v4
        with:
          name: BCVision-RC27.1-Hezar-Windows-Hosted
          path: |
            setup_output/BCVision_RC27.1_Setup.exe
            setup_output/BCVision_RC27.1_Update.exe
            dist/BCVision/**
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Publish RC27.1 GitHub Release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.2.0-rc27.1
          name: BC Vision 2.2.0 RC27.1
          prerelease: true
          generate_release_notes: true
          files: |
            setup_output/BCVision_RC27.1_Setup.exe
            setup_output/BCVision_RC27.1_Update.exe
