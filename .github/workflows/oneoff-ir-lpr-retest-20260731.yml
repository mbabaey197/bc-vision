name: One-off IR-LPR retest 2026-07-31

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/retest-trigger/**"

permissions:
  contents: read

jobs:
  retest:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 90
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "0.12.0"
          enable-cache: true
          cache-python: true
          cache-dependency-glob: requirements-ai-lock.txt

      - name: Set up portable Python
        shell: cmd
        run: |
          uv python install 3.13
          uv venv --python 3.13 --seed .venv
          echo %CD%\.venv\Scripts>>"%GITHUB_PATH%"

      - name: Install benchmark dependencies
        shell: cmd
        run: |
          python -m pip install --disable-pip-version-check --upgrade pip --quiet
          python -m pip install -r requirements-ai-lock.txt --quiet
          python -m pip install gdown==5.2.0 --quiet
          python -m pip check

      - name: Materialize one-off benchmark script
        shell: pwsh
        run: |
          $payload = @'

'@
          $gzip = Join-Path $env:RUNNER_TEMP "ir-lpr-retest.py.gz"
          $script = Join-Path $env:RUNNER_TEMP "ir-lpr-retest.py"
          [IO.File]::WriteAllBytes($gzip, [Convert]::FromBase64String(($payload -replace '\s','')))
          python -c "import gzip,pathlib; pathlib.Path(r'$script').write_bytes(gzip.decompress(pathlib.Path(r'$gzip').read_bytes()))"
          python -m py_compile "$script"
          "BCVISION_RETEST_SCRIPT=$script" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Locate verified RC15 OCR model
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $expected = "AD8D77D69CD0C914CB0CB3E0AC4E18709C446F78625A440D8F2D7AD2FB669482"
          $modelPath = $null
          $direct = @(
            (Join-Path $env:ProgramData "BCVision\data\models\next\rc15-cct-xs-ir-lpr-stage4.onnx"),
            (Join-Path $env:ProgramData "BCVision\data\models\next\bcvision-cct-xs.onnx")
          )
          foreach ($candidate in $direct) {
            if (Test-Path -LiteralPath $candidate) {
              $hash = (Get-FileHash -LiteralPath $candidate -Algorithm SHA256).Hash
              if ($hash -eq $expected) { $modelPath = $candidate; break }
            }
          }
          if (-not $modelPath) {
            $roots = @(
              (Join-Path $env:ProgramData "BCVision"),
              (Join-Path $env:USERPROFILE "Downloads"),
              (Join-Path $env:USERPROFILE "Desktop"),
              $env:RUNNER_WORKSPACE,
              $env:RUNNER_TEMP
            ) | Where-Object { $_ -and (Test-Path -LiteralPath $_) }
            foreach ($root in $roots) {
              foreach ($candidate in Get-ChildItem -LiteralPath $root -Filter *.onnx -File -Recurse -ErrorAction SilentlyContinue) {
                if ((Get-FileHash -LiteralPath $candidate.FullName -Algorithm SHA256).Hash -eq $expected) {
                  $modelPath = $candidate.FullName
                  break
                }
              }
              if ($modelPath) { break }
            }
          }
          if (-not $modelPath) {
            $roots = @(
              (Join-Path $env:ProgramData "BCVision"),
              (Join-Path $env:USERPROFILE "Downloads"),
              (Join-Path $env:USERPROFILE "Desktop"),
              $env:RUNNER_WORKSPACE
            ) | Where-Object { $_ -and (Test-Path -LiteralPath $_) }
            $installer = $null
            foreach ($root in $roots) {
              $installer = Get-ChildItem -LiteralPath $root -Filter BCVision_RC15_Experimental_Model_Installer.cmd -File -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
              if ($installer) { break }
            }
            if ($installer) {
              $content = [IO.File]::ReadAllText($installer.FullName)
              $match = [regex]::Match($content, '(?ms)^::BCVISION_PAYLOAD_BEGIN:ocr\r?\n(.*?)^::BCVISION_PAYLOAD_END:ocr\r?$')
              if ($match.Success) {
                $decoded = [Convert]::FromBase64String(($match.Groups[1].Value -replace '\s',''))
                $candidate = Join-Path $env:RUNNER_TEMP "rc15-cct-xs-ir-lpr-stage4.onnx"
                [IO.File]::WriteAllBytes($candidate, $decoded)
                if ((Get-FileHash -LiteralPath $candidate -Algorithm SHA256).Hash -eq $expected) {
                  $modelPath = $candidate
                }
              }
            }
          }
          if (-not $modelPath) { throw "Verified RC15 OCR model was not found on the runner." }
          "BCVISION_RETEST_MODEL=$modelPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Verified model: $modelPath"

      - name: Download exact validation and test archives
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $validation = Join-Path $env:RUNNER_TEMP "plate_image_with_dummy-validation.zip"
          $test = Join-Path $env:RUNNER_TEMP "plate_image_with_dummy-test.zip"
          python -m gdown --fuzzy "https://drive.google.com/file/d/1yZYdSNYBPXOoT_QySlH2RVTQS0AySA1z/view" -O "$validation"
          python -m gdown --fuzzy "https://drive.google.com/file/d/1HzZ5vgP5XsmbFCE-n8F70qlRRUtABIq6/view" -O "$test"
          @'
          import sys, zipfile
          for path in sys.argv[1:]:
              with zipfile.ZipFile(path) as archive:
                  bad = archive.testzip()
                  if bad:
                      raise SystemExit(f"Bad ZIP member: {bad}")
              print(f"Verified ZIP: {path}")
          '@ | python - "$validation" "$test"
          "BCVISION_RETEST_VALIDATION=$validation" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "BCVISION_RETEST_TEST=$test" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Run direct old-vs-new benchmark
        shell: pwsh
        run: |
          $output = Join-Path $env:RUNNER_TEMP "bcvision-ir-lpr-retest"
          python "$env:BCVISION_RETEST_SCRIPT" `
            --model "$env:BCVISION_RETEST_MODEL" `
            --validation-zip "$env:BCVISION_RETEST_VALIDATION" `
            --test-zip "$env:BCVISION_RETEST_TEST" `
            --output "$output" `
            --source-commit "${{ github.event.pull_request.base.sha }}"
          "BCVISION_RETEST_OUTPUT=$output" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Upload visual retest report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bcvision-ir-lpr-retest-20260731
          path: ${{ env.BCVISION_RETEST_OUTPUT }}
          if-no-files-found: error
          retention-days: 7
