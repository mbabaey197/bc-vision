name: Windows source and installer package

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "app/**"
      - "launcher.py"
      - "requirements*.txt"
      - "BUILD_PORTABLE_EXE.bat"
      - "installer/BCVision.iss"
      - "VERSION"
      - ".github/workflows/windows-release.yml"
  pull_request:
    branches:
      - main
    paths:
      - "app/**"
      - "launcher.py"
      - "requirements*.txt"
      - "BUILD_PORTABLE_EXE.bat"
      - "installer/BCVision.iss"
      - "VERSION"
      - ".github/workflows/windows-release.yml"

permissions:
  contents: read

jobs:
  build-and-smoke-test:
    runs-on: windows-latest
    timeout-minutes: 90

    env:
      PYTHONUTF8: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      BCVISION_SKIP_MODEL_PREP: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "Invalid VERSION value: $version"
          }
          "BCVISION_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements-lock.txt
            requirements-ai-lock.txt
            requirements-test.txt

      - name: Run regression tests
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check --upgrade pip --quiet
          python -m pip install -r requirements-test.txt --quiet
          python -m pytest -q tests

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build internal installer payload
        shell: cmd
        run: BUILD_PORTABLE_EXE.bat

      - name: Verify installer payload
        shell: pwsh
        run: |
          $required = @(
            "dist\BCVision\BCVision.exe",
            "installer\BCVision.iss"
          )
          foreach ($path in $required) {
            if (-not (Test-Path $path)) {
              throw "Required installer file missing: $path"
            }
          }

      - name: Application startup smoke test
        shell: pwsh
        run: |
          $process = Start-Process -FilePath "dist\BCVision\BCVision.exe" -PassThru
          try {
            $ready = $false
            foreach ($attempt in 1..60) {
              Start-Sleep -Seconds 1
              try {
                $response = Invoke-WebRequest -UseBasicParsing -Uri "http://127.0.0.1:8000/login" -TimeoutSec 2
                if ($response.StatusCode -eq 200) {
                  $ready = $true
                  break
                }
              } catch {}
              if ($process.HasExited) {
                throw "BCVision.exe exited before the login page became available. ExitCode=$($process.ExitCode)"
              }
            }
            if (-not $ready) {
              throw "BCVision.exe did not expose the login page during the smoke-test window."
            }
          } finally {
            if (-not $process.HasExited) {
              Stop-Process -Id $process.Id -Force
            }
          }

      - name: Compile standard Windows installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            throw "Inno Setup compiler was not found: $iscc"
          }
          & $iscc "installer\BCVision.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify installer output
        shell: pwsh
        run: |
          $path = "setup_output\BCVision_Setup_v$env:BCVISION_VERSION.exe"
          if (-not (Test-Path $path)) {
            throw "Expected installer output missing: $path"
          }
          if ((Get-Item $path).Length -lt 1MB) {
            throw "Installer output is unexpectedly small: $path"
          }

      - name: Install upgrade and data preservation test
        shell: pwsh
        run: |
          function Wait-ForLogin([System.Diagnostics.Process]$Process) {
            foreach ($attempt in 1..60) {
              Start-Sleep -Seconds 1
              try {
                $response = Invoke-WebRequest -UseBasicParsing -Uri "http://127.0.0.1:8000/login" -TimeoutSec 2
                if ($response.StatusCode -eq 200) { return }
              } catch {}
              if ($Process.HasExited) {
                throw "Installed BCVision.exe exited before login became available. ExitCode=$($Process.ExitCode)"
              }
            }
            throw "Installed BCVision.exe did not expose the login page."
          }

          $setup = Resolve-Path "setup_output\BCVision_Setup_v$env:BCVISION_VERSION.exe"
          $installArguments = @("/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/SP-")

          $firstInstall = Start-Process -FilePath $setup -ArgumentList $installArguments -Wait -PassThru
          if ($firstInstall.ExitCode -ne 0) {
            throw "Initial installer run failed. ExitCode=$($firstInstall.ExitCode)"
          }

          $installRoot = Join-Path $env:ProgramFiles "BC Vision"
          $installedExe = Join-Path $installRoot "BCVision.exe"
          $uninstaller = Join-Path $installRoot "unins000.exe"
          if (-not (Test-Path $installedExe)) {
            throw "Installed executable missing: $installedExe"
          }
          if (-not (Test-Path $uninstaller)) {
            throw "Standard uninstaller missing: $uninstaller"
          }

          $firstRun = Start-Process -FilePath $installedExe -PassThru
          try {
            Wait-ForLogin $firstRun
          } finally {
            if (-not $firstRun.HasExited) { Stop-Process -Id $firstRun.Id -Force }
          }

          $dataRoot = Join-Path $env:ProgramData "BCVision\data"
          $database = Join-Path $dataRoot "bcvision.db"
          $sentinel = Join-Path $dataRoot "installer-upgrade-preservation.txt"
          if (-not (Test-Path $database)) {
            throw "Database was not created at the persistent data path: $database"
          }
          "preserve-$env:GITHUB_SHA" | Set-Content -Encoding utf8 $sentinel
          $databaseHashBefore = (Get-FileHash $database -Algorithm SHA256).Hash

          $upgradeInstall = Start-Process -FilePath $setup -ArgumentList $installArguments -Wait -PassThru
          if ($upgradeInstall.ExitCode -ne 0) {
            throw "Installer upgrade run failed. ExitCode=$($upgradeInstall.ExitCode)"
          }
          if (-not (Test-Path $sentinel)) {
            throw "Persistent data sentinel was removed during installer upgrade."
          }
          $databaseHashAfter = (Get-FileHash $database -Algorithm SHA256).Hash
          if ($databaseHashBefore -ne $databaseHashAfter) {
            throw "Database content changed during installer upgrade."
          }

          $secondRun = Start-Process -FilePath $installedExe -PassThru
          try {
            Wait-ForLogin $secondRun
          } finally {
            if (-not $secondRun.HasExited) { Stop-Process -Id $secondRun.Id -Force }
          }

      - name: Create release outputs
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release_output | Out-Null
          git archive --format=zip --output="release_output\BC_Vision_Source_v$env:BCVISION_VERSION.zip" HEAD
          Copy-Item "setup_output\BCVision_Setup_v$env:BCVISION_VERSION.exe" "release_output\BC_Vision_Setup_v$env:BCVISION_VERSION.exe"

          $releaseFiles = Get-ChildItem release_output -File | Sort-Object Name
          $checksumLines = foreach ($file in $releaseFiles) {
            $hash = (Get-FileHash $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash *$($file.Name)"
          }
          $checksumLines | Set-Content -Encoding ascii release_output\SHA256SUMS.txt

          foreach ($line in Get-Content release_output\SHA256SUMS.txt) {
            if ($line -notmatch '^([0-9a-f]{64}) \*(.+)$') {
              throw "Invalid checksum line: $line"
            }
            $expected = $Matches[1]
            $path = Join-Path release_output $Matches[2]
            $actual = (Get-FileHash $path -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actual -ne $expected) {
              throw "Checksum verification failed for $path"
            }
          }

      - name: Upload source and installer outputs
        uses: actions/upload-artifact@v4
        with:
          name: BCVision-v${{ steps.version.outputs.version }}-windows-release
          path: release_output/*
          if-no-files-found: error
          retention-days: 14
