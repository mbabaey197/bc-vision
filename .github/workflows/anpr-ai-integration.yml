name: ANPR AI integration

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - "app/ai/**"
      - "requirements-ai-lock.txt"
      - "tests/test_ai_runtime.py"
      - ".github/workflows/anpr-ai-integration.yml"

permissions:
  contents: read

jobs:
  ai-runtime:
    runs-on: windows-latest
    timeout-minutes: 45

    env:
      BCVISION_RUN_AI_INTEGRATION: "1"
      BCVISION_PLATE_MODEL: ${{ runner.temp }}\bcvision-models\plate\best.pt
      BCVISION_EASYOCR_MODEL_DIR: ${{ runner.temp }}\bcvision-models\easyocr
      BCVISION_EASYOCR_DOWNLOAD: "0"
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-ai-lock.txt

      - name: Restore verified model cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}\bcvision-models
          key: bcvision-anpr-models-v1

      - name: Install AI runtime
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check --upgrade pip
          python -m pip install -r requirements-ai-lock.txt
          python -m pip install pytest==9.0.2 cryptography==49.0.0
          python -m pip check

      - name: Compile AI modules
        shell: pwsh
        run: |
          python -m compileall -q app/ai

      - name: Download, verify and load models
        shell: pwsh
        run: |
          python -m pytest -q tests/test_ai_runtime.py
