name: ANPR PR validation

on:
  pull_request:
    branches:
      - main
    paths:
      - "app/**"
      - "installer/**"
      - "launcher.py"
      - "VERSION"
      - "requirements-*.txt"
      - "tests/**"
      - "tools/**"
      - ".github/workflows/**"

permissions:
  contents: read

concurrency:
  group: anpr-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  regression:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v8
        with:
          version: "0.12.0"
          enable-cache: true
      - run: |
          uv python install 3.13
          uv venv --python 3.13 --seed .venv
          .venv\Scripts\python -m pip install -r requirements-test.txt
      - run: .venv\Scripts\python -m pytest -q tests

  ai-runtime:
    needs: regression
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      BCVISION_RUN_AI_INTEGRATION: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v8
        with:
          version: "0.12.0"
          enable-cache: true
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}\bcvision-models
          key: bcvision-anpr-models-v2-onnx
      - run: |
          uv python install 3.13
          uv venv --python 3.13 --seed .venv
          .venv\Scripts\python -m pip install -r requirements-ai-lock.txt
          .venv\Scripts\python -m pip install pytest==9.0.2
      - run: .venv\Scripts\python -m pytest -q tests/test_ai_runtime.py
