# Trusted, isolated validation for BC Vision ANPR pull requests.
# Per-job temporary storage keeps installed BC Vision data out of CI.
name: ANPR PR validation

on:
  pull_request:
    branches:
      - main
      - agent/anpr-rescue-plate-search-rc19
      - agent/anpr-detection-recovery-rc25
    paths:
      - "app/**"
      - "installer/**"
      - "launcher.py"
      - "VERSION"
      - "requirements-lock.txt"
      - "requirements-ai-lock.txt"
      - "requirements-test.txt"
      - "requirements-cct-training.txt"
      - "tests/**"
      - "tools/**"
      - "training/**"
      - "docs/ANPR_MODELS.md"
      - ".github/workflows/**"

permissions:
  contents: read

concurrency:
  group: anpr-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  regression:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          clean: false
      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.12.0"
          enable-cache: true
          cache-python: true
          cache-dependency-glob: requirements-test.txt
      - name: Set up portable Python
        shell: cmd
        run: |
          if not exist .venv-regression\Scripts\python.exe uv python install 3.13
          if not exist .venv-regression\Scripts\python.exe uv venv --python 3.13 --seed .venv-regression
          echo %CD%\.venv-regression\Scripts>>"%GITHUB_PATH%"
      - name: Install test dependencies
        shell: cmd
        run: |
          python scripts\build_dependency_stamp.py check .venv-regression\.bcvision-test-dependencies.sha256 requirements-test.txt
          if errorlevel 1 python -m pip install --disable-pip-version-check -r requirements-test.txt --quiet
          if errorlevel 1 exit /b 1
          python scripts\build_dependency_stamp.py write .venv-regression\.bcvision-test-dependencies.sha256 requirements-test.txt
      - name: Compile and test
        shell: cmd
        env:
          BCVISION_DATA_DIR: ${{ runner.temp }}\bcvision-data\regression
          BCVISION_LICENSE_REGRESSION: "1"
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python -m compileall -q app/ai app/database.py app/streams.py
          python -m pytest -q tests

  ai-runtime:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 45
    env:
      BCVISION_RUN_AI_INTEGRATION: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          clean: false
      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.12.0"
          enable-cache: true
          cache-python: true
          cache-dependency-glob: requirements-ai-lock.txt
      - name: Set up portable Python
        shell: cmd
        run: |
          if not exist .venv-ai\Scripts\python.exe uv python install 3.13
          if not exist .venv-ai\Scripts\python.exe uv venv --python 3.13 --seed .venv-ai
          echo %CD%\.venv-ai\Scripts>>"%GITHUB_PATH%"
      - uses: actions/cache@v4
        with:
          path: .ci-cache\bcvision-models
          key: bcvision-anpr-models-v2-onnx
      - name: Install AI runtime
        shell: cmd
        run: |
          python scripts\build_dependency_stamp.py check .venv-ai\.bcvision-ai-dependencies.sha256 requirements-ai-lock.txt requirements-test.txt
          if errorlevel 1 python -m pip install --disable-pip-version-check -r requirements-ai-lock.txt pytest==9.0.2 --quiet
          if errorlevel 1 exit /b 1
          python scripts\build_dependency_stamp.py write .venv-ai\.bcvision-ai-dependencies.sha256 requirements-ai-lock.txt requirements-test.txt
          python -m pip check
      - name: Verify real engines and models
        shell: cmd
        env:
          BCVISION_DATA_DIR: ${{ runner.temp }}\bcvision-data\ai-runtime
          BCVISION_PLATE_MODEL: ${{ github.workspace }}\.ci-cache\bcvision-models\plate\plate_yolo.onnx
          BCVISION_PLATE_FALLBACK_MODEL: ${{ github.workspace }}\.ci-cache\bcvision-models\plate\plate_yolo_fallback.onnx
          BCVISION_CRNN_MODEL: ${{ github.workspace }}\.ci-cache\bcvision-models\crnn\ocr_crnn.onnx
          BCVISION_CNN_MODEL: ${{ github.workspace }}\.ci-cache\bcvision-models\cnn\ocr_cnn.onnx
        run: |
          python -m compileall -q app/ai
          python -m pytest -q tests/test_ai_runtime.py
