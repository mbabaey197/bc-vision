# Temporary stop-only workflow for cancelling the active PR run.
name: ANPR PR validation

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: anpr-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  stop-only:
    if: ${{ false }}
    runs-on: [self-hosted, Windows, X64]
    steps:
      - run: echo stopped
