name: Publish complete release

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Successful Windows release-candidate run ID
        required: false
        type: string
  push:
    branches:
      - main
    paths:
      - ".github/workflows/publish-complete-release.yml"

permissions:
  actions: read
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout release metadata
        uses: actions/checkout@v4

      - name: Resolve verified candidate
        id: candidate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REQUESTED_RUN_ID: ${{ inputs.source_run_id }}
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '\r\n' < VERSION)"
          artifact_name="BCVision-${version}-windows"
          run_id="$REQUESTED_RUN_ID"

          if [[ -z "$run_id" ]]; then
            for candidate in $(
              gh api --paginate \
                "repos/$GITHUB_REPOSITORY/actions/workflows/windows-release-candidate.yml/runs?status=success&per_page=100" \
                --jq '.workflow_runs[].id'
            ); do
              if gh api \
                "repos/$GITHUB_REPOSITORY/actions/runs/$candidate/artifacts" \
                --jq '.artifacts[].name' |
                grep -Fxq "$artifact_name"; then
                run_id="$candidate"
                break
              fi
            done
          fi

          if [[ -z "$run_id" ]]; then
            echo "No successful verified candidate contains $artifact_name" >&2
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "artifact_name=$artifact_name" >> "$GITHUB_OUTPUT"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"

      - name: Download verified release bundle
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.candidate.outputs.artifact_name }}
          path: bundle
          repository: ${{ github.repository }}
          run-id: ${{ steps.candidate.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify release files
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.candidate.outputs.version }}
        run: |
          set -euo pipefail
          cd bundle
          sha256sum -c SHA256SUMS.txt
          test -f "BCVision_Setup_v${RELEASE_VERSION}.exe"
          test -f "BCVision_Update_v${RELEASE_VERSION}.exe"
          test -f "BC_Vision_v${RELEASE_VERSION}_Source.zip"

      - name: Publish complete prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ steps.candidate.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          tag="v${RELEASE_VERSION}"
          assets=(
            "bundle/BCVision_Setup_v${RELEASE_VERSION}.exe"
            "bundle/BCVision_Update_v${RELEASE_VERSION}.exe"
            "bundle/BC_Vision_v${RELEASE_VERSION}_Source.zip"
            "bundle/SHA256SUMS.txt"
          )

          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" \
              "${assets[@]}" \
              --clobber \
              --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$tag" \
              "${assets[@]}" \
              --prerelease \
              --target main \
              --title "BC Vision ${RELEASE_VERSION}" \
              --notes "Verified BC Vision release. Windows build, real offline ANPR inference, clean install, in-place update, and persistent-data checks completed successfully." \
              --repo "$GITHUB_REPOSITORY"
          fi
