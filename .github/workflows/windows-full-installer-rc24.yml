name: Windows full installer RC24

on:
  workflow_dispatch:
  pull_request:
    branches:
      - agent/anpr-rescue-plate-search-rc19
    paths:
      - "installer/BCVision.iss"
      - ".github/workflows/windows-full-installer-rc24.yml"

permissions:
  contents: read

concurrency:
  group: windows-full-installer-rc24-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: false

jobs:
  build-test-installer:
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUTF8: "1"

    steps:
      - name: Checkout exact RC24 candidate
        uses: actions/checkout@v4
        with:
          clean: true

      - name: Read candidate version
        id: version
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $value = (Get-Content VERSION -Raw).Trim()
          if ($value -ne "2.2.0-rc24") {
            throw "Unexpected candidate version: $value"
          }
          "value=$value" >> $env:GITHUB_OUTPUT

      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-test.txt

      - name: Create test environment
        shell: cmd
        run: |
          python -m venv .venv
          echo %CD%\.venv\Scripts>>"%GITHUB_PATH%"

      - name: Run source regression
        shell: cmd
        env:
          BCVISION_DATA_DIR: ${{ runner.temp }}\bcvision-data\full-installer-regression
        run: |
          python -m pip install --disable-pip-version-check -r requirements-test.txt --quiet
          if errorlevel 1 exit /b 1
          python -m compileall -q app launcher.py
          python -m pytest -q tests

      - name: Build clean Windows application
        shell: cmd
        run: BUILD_PORTABLE_EXE.bat

      - name: Verify windowless executable
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          python scripts\verify_windows_gui_subsystem.py dist\BCVision\BCVision.exe

      - name: Prepare verified Inno Setup
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $iscc = & .\scripts\ensure_inno_setup.ps1
          if (-not $iscc -or -not (Test-Path $iscc)) {
            throw "ISCC.exe was not prepared"
          }
          "INNO_ISCC=$iscc" >> $env:GITHUB_ENV

      - name: Build full installer
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          & $env:INNO_ISCC installer\BCVision.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify clean install, shortcuts, upgrade and persistent data
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $ErrorActionPreference = "Stop"
          $version = (Get-Content VERSION -Raw).Trim()
          $setup = (Resolve-Path "setup_output\BCVision_Setup_v$version.exe").Path
          $installDir = Join-Path $env:RUNNER_TEMP "bcvision-full-install"
          $dataDir = Join-Path $env:RUNNER_TEMP "bcvision-full-data"
          $firstResult = Join-Path $env:RUNNER_TEMP "bcvision-full-first.json"
          $secondResult = Join-Path $env:RUNNER_TEMP "bcvision-full-upgrade.json"
          $setupLog = Join-Path $env:RUNNER_TEMP "bcvision-full-setup.log"
          $upgradeLog = Join-Path $env:RUNNER_TEMP "bcvision-full-upgrade.log"
          $desktopLink = Join-Path ([Environment]::GetFolderPath("Desktop")) "BC Vision.lnk"
          $startLink = Join-Path ([Environment]::GetFolderPath("Programs")) "BC Vision.lnk"

          $install = Start-Process -FilePath $setup -ArgumentList @(
            "/VERYSILENT",
            "/SUPPRESSMSGBOXES",
            "/NORESTART",
            "/CURRENTUSER",
            "/LOG=$setupLog",
            "/DIR=$installDir"
          ) -Wait -PassThru
          if ($install.ExitCode -ne 0) {
            if (Test-Path $setupLog) { Get-Content $setupLog }
            throw "Full installer exited with $($install.ExitCode)"
          }

          $exe = Join-Path $installDir "BCVision.exe"
          if (-not (Test-Path $exe)) { throw "BCVision.exe was not installed" }
          if (-not (Test-Path $desktopLink)) { throw "Desktop shortcut was not created" }
          if (-not (Test-Path $startLink)) { throw "Start Menu shortcut was not created" }

          $shell = New-Object -ComObject WScript.Shell
          $expectedTarget = [IO.Path]::GetFullPath($exe)
          foreach ($link in @($desktopLink, $startLink)) {
            $actualTarget = [IO.Path]::GetFullPath($shell.CreateShortcut($link).TargetPath)
            if ($actualTarget -ne $expectedTarget) {
              throw "Shortcut target is invalid: $link -> $actualTarget"
            }
          }

          $env:BCVISION_DATA_DIR = $dataDir
          $env:BCVISION_SKIP_MODEL_PREP = "1"
          $first = Start-Process -FilePath $exe -ArgumentList @(
            "--self-test",
            "--verify-anpr",
            "--self-test-output",
            $firstResult
          ) -Wait -PassThru
          if ($first.ExitCode -ne 0) {
            throw "Installed executable self-test exited with $($first.ExitCode)"
          }
          $firstJson = Get-Content $firstResult -Raw | ConvertFrom-Json
          if (-not $firstJson.ok -or -not $firstJson.anpr_ready -or $firstJson.version -ne $version) {
            throw "Installed application or packaged ANPR models failed validation"
          }

          $marker = "preserve-$([guid]::NewGuid())"
          $env:BCVISION_TEST_MARKER = $marker
          python -c "import os,sqlite3; p=os.path.join(os.environ['BCVISION_DATA_DIR'],'bcvision.db'); c=sqlite3.connect(p); c.execute('INSERT OR REPLACE INTO settings(key,value) VALUES(?,?)',('full_installer_marker',os.environ['BCVISION_TEST_MARKER'])); c.commit(); c.close()"
          if ($LASTEXITCODE -ne 0) { throw "Database marker could not be created" }
          $modelDir = Join-Path $dataDir "models\plate"
          New-Item -ItemType Directory -Path $modelDir -Force | Out-Null
          Set-Content -Path (Join-Path $modelDir "preserve.marker") -Value $marker

          $upgrade = Start-Process -FilePath $setup -ArgumentList @(
            "/VERYSILENT",
            "/SUPPRESSMSGBOXES",
            "/NORESTART",
            "/CURRENTUSER",
            "/LOG=$upgradeLog",
            "/DIR=$installDir"
          ) -Wait -PassThru
          if ($upgrade.ExitCode -ne 0) {
            if (Test-Path $upgradeLog) { Get-Content $upgradeLog }
            throw "Full installer upgrade exited with $($upgrade.ExitCode)"
          }

          $second = Start-Process -FilePath $exe -ArgumentList @(
            "--self-test",
            "--verify-anpr",
            "--self-test-output",
            $secondResult
          ) -Wait -PassThru
          if ($second.ExitCode -ne 0) {
            throw "Upgraded executable self-test exited with $($second.ExitCode)"
          }
          $secondJson = Get-Content $secondResult -Raw | ConvertFrom-Json
          if (-not $secondJson.ok -or -not $secondJson.anpr_ready -or $secondJson.version -ne $version) {
            throw "Upgraded application or packaged ANPR models failed validation"
          }

          python -c "import os,sqlite3,sys; p=os.path.join(os.environ['BCVISION_DATA_DIR'],'bcvision.db'); c=sqlite3.connect(p); r=c.execute('SELECT value FROM settings WHERE key=?',('full_installer_marker',)).fetchone(); c.close(); sys.exit(0 if r and r[0]==os.environ['BCVISION_TEST_MARKER'] else 1)"
          if ($LASTEXITCODE -ne 0) { throw "Database was not preserved by reinstall" }
          if ((Get-Content (Join-Path $modelDir "preserve.marker") -Raw).Trim() -ne $marker) {
            throw "AI model data was not preserved by reinstall"
          }

          $uninstaller = Get-ChildItem $installDir -Filter "unins*.exe" | Select-Object -First 1
          if (-not $uninstaller) { throw "Standard uninstaller was not created" }

          $uninstall = Start-Process -FilePath $uninstaller.FullName -ArgumentList @(
            "/VERYSILENT",
            "/SUPPRESSMSGBOXES",
            "/NORESTART"
          ) -Wait -PassThru
          if ($uninstall.ExitCode -ne 0) {
            throw "Uninstaller exited with $($uninstall.ExitCode)"
          }
          if (-not (Test-Path (Join-Path $dataDir "bcvision.db"))) {
            throw "Persistent database was removed by uninstall"
          }
          if (-not (Test-Path (Join-Path $modelDir "preserve.marker"))) {
            throw "Persistent AI model data was removed by uninstall"
          }

      - name: Create installer checksum
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $ErrorActionPreference = "Stop"
          $version = (Get-Content VERSION -Raw).Trim()
          $releaseDir = Join-Path $PWD "full-installer"
          if (Test-Path $releaseDir) {
            Remove-Item $releaseDir -Recurse -Force
          }
          New-Item -ItemType Directory -Path $releaseDir | Out-Null
          $setup = "setup_output\BCVision_Setup_v$version.exe"
          Copy-Item $setup $releaseDir
          $target = Join-Path $releaseDir (Split-Path $setup -Leaf)
          $hash = (Get-FileHash $target -Algorithm SHA256).Hash
          Set-Content -Path "$target.sha256" -Value "$hash  $(Split-Path $target -Leaf)" -Encoding ascii

      - name: Upload verified full installer
        uses: actions/upload-artifact@v4
        with:
          name: BCVision-${{ steps.version.outputs.value }}-full-installer-${{ github.run_number }}
          path: full-installer/*
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
