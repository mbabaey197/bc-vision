name: ANPR tests

on:
  push:
    branches:
      - main
      - codex/anpr-completion
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-test.txt

      - name: Install test dependencies
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check --upgrade pip
          python -m pip install -r requirements-test.txt

      - name: Compile ANPR modules
        shell: pwsh
        run: |
          python -m compileall -q app/ai app/database.py app/streams.py

      - name: Run ANPR test suite
        shell: pwsh
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python -m pytest -q tests
