name: ANPR tests

on:
  push:
    branches:
      - main
      - codex/anpr-completion
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-test.txt

      - name: Install test dependencies
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check --upgrade pip --quiet
          python -m pip install -r requirements-test.txt --quiet

      - name: Compile ANPR modules
        shell: pwsh
        run: |
          python -m compileall -q app/ai app/database.py app/streams.py

      - name: Run ANPR test suite
        id: pytest
        continue-on-error: true
        shell: pwsh
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python -m pytest -q tests *>&1 | Tee-Object -FilePath pytest-output.txt
          exit $LASTEXITCODE

      - name: Upload test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: anpr-pytest-output
          path: pytest-output.txt
          if-no-files-found: error
          retention-days: 7

      - name: Enforce test result
        if: steps.pytest.outcome == 'failure'
        shell: pwsh
        run: |
          Write-Error "ANPR tests failed. See the anpr-pytest-output artifact."
          exit 1
