# Unified Windows validation: fast ANPR regression plus real AI model smoke test.
name: ANPR tests

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: anpr-main-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      # Use the isolated interpreter that passed PR model-export validation.
      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.12.0"
          enable-cache: true
          cache-python: false
          cache-dependency-glob: requirements-test.txt
      - name: Set up portable Python
        shell: cmd
        run: |
          set "UV_PYTHON_INSTALL_DIR=%RUNNER_TEMP%\uv-python-%GITHUB_RUN_ID%-%GITHUB_RUN_ATTEMPT%-regression"
          uv python install 3.13.14
          if errorlevel 1 exit /b %errorlevel%
          uv venv --python 3.13.14 --seed .venv
          if errorlevel 1 exit /b %errorlevel%
          echo %CD%\.venv\Scripts>>"%GITHUB_PATH%"

      - name: Install test dependencies
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check --upgrade pip --quiet
          python -m pip install -r requirements-test.txt --quiet

      - name: Compile ANPR modules
        shell: pwsh
        run: |
          python -m compileall -q app/ai app/database.py app/streams.py

      - name: Run ANPR test suite
        id: pytest
        continue-on-error: true
        shell: pwsh
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python -m pytest -q tests --timeout=120 --timeout-method=thread --durations=20 *>&1 | Tee-Object -FilePath pytest-output.txt
          exit $LASTEXITCODE

      - name: Enforce test result
        if: steps.pytest.outcome == 'failure'
        shell: pwsh
        run: |
          Write-Error "ANPR tests failed. See the Run ANPR test suite step log."
          exit 1

  ai-runtime:
    runs-on: windows-latest
    timeout-minutes: 45

    env:
      BCVISION_RUN_AI_INTEGRATION: "1"
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      # Use the isolated interpreter that passed PR model-export validation.
      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.12.0"
          enable-cache: true
          cache-python: false
          cache-dependency-glob: requirements-ai-lock.txt
      - name: Set up portable Python
        shell: cmd
        run: |
          set "UV_PYTHON_INSTALL_DIR=%RUNNER_TEMP%\uv-python-%GITHUB_RUN_ID%-%GITHUB_RUN_ATTEMPT%-ai"
          uv python install 3.13.14
          if errorlevel 1 exit /b %errorlevel%
          uv venv --python 3.13.14 --seed .venv
          if errorlevel 1 exit /b %errorlevel%
          echo %CD%\.venv\Scripts>>"%GITHUB_PATH%"

      - name: Restore verified model cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}\bcvision-models
          key: bcvision-anpr-models-v4-yolo11n-yolov8n-hezar
          restore-keys: |
            bcvision-anpr-models-v3-yolo11n-hezar

      - name: Install AI runtime
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check --upgrade pip --quiet
          python -m pip install -r requirements-ai-lock.txt --quiet
          python -m pip install pytest==9.0.2 --quiet
          python -m pip check

      - name: Compile AI modules
        shell: pwsh
        run: |
          python -m compileall -q app/ai

      - name: Download, verify and load models
        id: ai_test
        continue-on-error: true
        shell: pwsh
        env:
          BCVISION_PLATE_MODEL: ${{ runner.temp }}\bcvision-models\plate\plate_yolo11n.onnx
          BCVISION_PLATE_YOLOV8N_MODEL: ${{ runner.temp }}\bcvision-models\plate\plate_yolov8n.onnx
          BCVISION_PLATE_FALLBACK_MODEL: ${{ runner.temp }}\bcvision-models\plate\plate_yolo_fallback.onnx
          BCVISION_CRNN_MODEL: ${{ runner.temp }}\bcvision-models\crnn\ocr_crnn.onnx
          BCVISION_CNN_MODEL: ${{ runner.temp }}\bcvision-models\cnn\ocr_cnn.onnx
          BCVISION_HEZAR_MODEL: ${{ runner.temp }}\bcvision-models\hezar\crnn_fa_v2.onnx
        run: |
          python -m pytest -q tests/test_ai_runtime.py *>&1 | Tee-Object -FilePath ai-test-output.txt
          exit $LASTEXITCODE

      - name: Enforce AI result
        if: steps.ai_test.outcome == 'failure'
        shell: pwsh
        run: |
          Write-Error "ANPR AI integration failed. See the model smoke-test step log."
          exit 1
