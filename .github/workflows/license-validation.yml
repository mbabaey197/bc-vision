name: Offline license validation

on:
  workflow_dispatch:
  push:
    branches:
      - agent/harden-license-enforcement

permissions:
  contents: read
  actions: write
  issues: write
  pull-requests: write

concurrency:
  group: offline-license-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cancel-stale-pr-runs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Cancel unrelated PR benchmark runs for this branch
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import time
          import urllib.request

          time.sleep(5)
          repo = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
          }
          request = urllib.request.Request(
              f"https://api.github.com/repos/{repo}/actions/runs?event=pull_request&per_page=100",
              headers=headers,
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              runs = json.load(response).get("workflow_runs", [])
          for run in runs:
              if (
                  run.get("name") == "ANPR PR validation"
                  and run.get("head_branch") == "agent/harden-license-enforcement"
                  and run.get("status") in {"queued", "in_progress", "pending"}
              ):
                  cancel = urllib.request.Request(
                      f"https://api.github.com/repos/{repo}/actions/runs/{run['id']}/cancel",
                      data=b"{}",
                      method="POST",
                      headers=headers,
                  )
                  try:
                      urllib.request.urlopen(cancel, timeout=30).read()
                      print(f"Cancelled stale PR run {run['id']}")
                  except Exception as exc:
                      print(f"Run {run['id']} was already finished or could not be cancelled: {exc}")
          PY

  regression:
    needs: cancel-stale-pr-runs
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "0.12.0"
          enable-cache: true
          cache-python: true
          cache-dependency-glob: requirements-test.txt
      - name: Set up portable Python
        shell: cmd
        run: |
          uv python install 3.13
          uv venv --python 3.13 --seed .venv
          echo %CD%\.venv\Scripts>>"%GITHUB_PATH%"
      - name: Install test dependencies
        shell: cmd
        run: |
          python -m pip install --disable-pip-version-check --upgrade pip --quiet
          python -m pip install -r requirements-test.txt --quiet
      - name: Compile and test
        shell: cmd
        env:
          BCVISION_DATA_DIR: ${{ runner.temp }}\bcvision-data\license-regression
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python -m compileall -q app
          python -m pytest -q tests

  ai-runtime:
    needs: regression
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 45
    env:
      BCVISION_RUN_AI_INTEGRATION: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "0.12.0"
          enable-cache: true
          cache-python: true
          cache-dependency-glob: requirements-ai-lock.txt
      - name: Set up portable Python
        shell: cmd
        run: |
          uv python install 3.13
          uv venv --python 3.13 --seed .venv
          echo %CD%\.venv\Scripts>>"%GITHUB_PATH%"
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}\bcvision-models
          key: bcvision-anpr-models-v2-onnx
      - name: Install AI runtime
        shell: cmd
        run: |
          python -m pip install --disable-pip-version-check --upgrade pip --quiet
          python -m pip install -r requirements-ai-lock.txt --quiet
          python -m pip install pytest==9.0.2 --quiet
          python -m pip check
      - name: Verify real engines and models
        shell: cmd
        env:
          BCVISION_DATA_DIR: ${{ runner.temp }}\bcvision-data\license-ai-runtime
          BCVISION_PLATE_MODEL: ${{ runner.temp }}\bcvision-models\plate\plate_yolo.onnx
          BCVISION_PLATE_FALLBACK_MODEL: ${{ runner.temp }}\bcvision-models\plate\plate_yolo_fallback.onnx
          BCVISION_CRNN_MODEL: ${{ runner.temp }}\bcvision-models\crnn\ocr_crnn.onnx
          BCVISION_CNN_MODEL: ${{ runner.temp }}\bcvision-models\cnn\ocr_cnn.onnx
        run: |
          python -m compileall -q app/ai
          python -m pytest -q tests/test_ai_runtime.py

  report:
    if: always()
    needs: [regression, ai-runtime]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      REGRESSION_RESULT: ${{ needs.regression.result }}
      AI_RUNTIME_RESULT: ${{ needs.ai-runtime.result }}
      HEAD_SHA: ${{ github.sha }}
    steps:
      - name: Report exact validation result to PR 34
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $success = ($env:REGRESSION_RESULT -eq "success" -and $env:AI_RUNTIME_RESULT -eq "success")
          $mark = if ($success) { "✅" } else { "❌" }
          $body = @"
          $mark **Offline license validation**

          - Commit: ``$env:HEAD_SHA``
          - Regression: **$env:REGRESSION_RESULT**
          - AI runtime: **$env:AI_RUNTIME_RESULT**
          - Runner: self-hosted Windows X64
          "@
          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = "application/vnd.github+json"
            "X-GitHub-Api-Version" = "2022-11-28"
          }
          $payload = @{ body = $body } | ConvertTo-Json
          Invoke-RestMethod `
            -Method Post `
            -Uri "https://api.github.com/repos/${{ github.repository }}/issues/34/comments" `
            -Headers $headers `
            -ContentType "application/json" `
            -Body $payload | Out-Null
          if (-not $success) { exit 1 }
