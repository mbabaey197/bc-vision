name: RC25 license manager artifact

on:
  push:
    branches:
      - agent/anpr-detection-recovery-rc25
    paths:
      - ".github/workflows/rc25-license-manager-artifact.yml"
  pull_request:
    branches:
      - agent/anpr-native-ingest-rc24
    paths:
      - ".github/workflows/rc25-license-manager-artifact.yml"
      - "tools/license_manager.py"
      - "tools/license_service.py"
      - "app/license_format.py"
      - "license_public_key.pem"
      - "tests/test_license.py"
      - "tests/test_license_manager.py"

permissions:
  contents: read

concurrency:
  group: rc25-license-manager-artifact-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install pinned build dependencies
        shell: powershell
        run: |
          python -m pip install --disable-pip-version-check pyinstaller==6.21.0 cryptography==49.0.0 pytest==9.0.2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Test license format and manager service
        shell: powershell
        run: |
          python -m pytest -q tests/test_license.py tests/test_license_manager.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify private key is absent
        shell: powershell
        run: |
          if (Test-Path "tools\keys\license_private_key.pem") {
            throw "Private licensing key must never enter GitHub Actions"
          }
          if (Get-ChildItem -Recurse -File | Select-String -Quiet -SimpleMatch "BEGIN PRIVATE KEY") {
            throw "A private key was found in the checkout"
          }

      - name: Build standalone Windows GUI
        shell: powershell
        run: |
          python -m PyInstaller --noconfirm --clean --windowed --onefile --name BCVision_License_Manager_RC25_467084FA --paths . --hidden-import tools.license_service --hidden-import app.license_format --add-data "license_public_key.pem;." tools/license_manager.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path "dist\BCVision_License_Manager_RC25_467084FA.exe")) {
            throw "License manager executable was not created"
          }

      - name: Smoke-test bundled resources and GUI
        shell: powershell
        run: |
          $exe = Resolve-Path "dist\BCVision_License_Manager_RC25_467084FA.exe"
          $resourceTest = Start-Process -FilePath $exe -ArgumentList "--self-test" -Wait -PassThru
          if ($resourceTest.ExitCode -ne 0) {
            throw "Bundled public key self-test failed with code $($resourceTest.ExitCode)"
          }
          $process = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 6
          if ($process.HasExited) {
            throw "GUI exited during smoke test with code $($process.ExitCode)"
          }
          Stop-Process -Id $process.Id -Force
          Wait-Process -Id $process.Id -ErrorAction SilentlyContinue

      - name: Create checksum
        shell: powershell
        run: |
          $exe = Get-Item "dist\BCVision_License_Manager_RC25_467084FA.exe"
          $hash = (Get-FileHash $exe.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -Path "dist\BCVision_License_Manager_RC25_467084FA.exe.sha256" -Value "$hash  $($exe.Name)" -Encoding ascii
          Get-Content "dist\BCVision_License_Manager_RC25_467084FA.exe.sha256"
          Write-Host "SIZE=$($exe.Length)"

      - name: Upload verified artifact
        uses: actions/upload-artifact@v4
        with:
          name: BCVision-License-Manager-RC25-${{ github.run_number }}
          path: |
            dist/BCVision_License_Manager_RC25_467084FA.exe
            dist/BCVision_License_Manager_RC25_467084FA.exe.sha256
          if-no-files-found: error
          retention-days: 3
          compression-level: 0
