name: Publish updater release

on:
  workflow_run:
    workflows:
      - Publish standalone updater
    types:
      - completed

permissions:
  actions: read
  contents: write

jobs:
  publish-updater:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Download verified standalone updater
        uses: actions/download-artifact@v4
        with:
          path: verified-updater
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify updater and resolve version
        id: updater
        shell: bash
        run: |
          set -euo pipefail
          source_file="$(find verified-updater -type f -name 'BCVision_Update_v*.exe' -print -quit)"
          if [[ -z "$source_file" ]]; then
            echo "Verified updater executable was not found" >&2
            exit 1
          fi
          checksum_file="${source_file}.sha256"
          if [[ ! -f "$checksum_file" ]]; then
            echo "Updater checksum was not found: $checksum_file" >&2
            exit 1
          fi
          filename="$(basename "$source_file")"
          version="${filename#BCVision_Update_v}"
          version="${version%.exe}"
          (
            cd "$(dirname "$source_file")"
            sha256sum -c "$(basename "$checksum_file")"
          )
          echo "source_file=$source_file" >> "$GITHUB_OUTPUT"
          echo "checksum_file=$checksum_file" >> "$GITHUB_OUTPUT"
          echo "filename=$filename" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Publish public prerelease asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_FILE: ${{ steps.updater.outputs.source_file }}
          CHECKSUM_FILE: ${{ steps.updater.outputs.checksum_file }}
          RELEASE_TAG: ${{ steps.updater.outputs.tag }}
          RELEASE_VERSION: ${{ steps.updater.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" \
              "$SOURCE_FILE" \
              "$CHECKSUM_FILE" \
              --clobber \
              --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$RELEASE_TAG" \
              "$SOURCE_FILE" \
              "$CHECKSUM_FILE" \
              --prerelease \
              --target main \
              --title "BC Vision $RELEASE_VERSION" \
              --notes "Verified one-click BC Vision updater. The Windows build, clean install, in-place update, and persistent-data checks completed successfully." \
              --repo "$GITHUB_REPOSITORY"
          fi
