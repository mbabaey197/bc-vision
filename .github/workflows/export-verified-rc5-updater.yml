name: Publish verified rc5 prerelease

on:
  push:
    branches:
      - "agent/anpr-video-processing-visible-rc5"
    paths:
      - ".github/workflows/export-verified-rc5-updater.yml"

permissions:
  actions: read
  contents: write

jobs:
  publish-prerelease:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: v2.2.0-rc5
      REPO: mahdibabaey197/bc-vision
    steps:
      - name: Download verified Windows candidate
        run: |
          gh run download 30276736514 \
            --repo "$REPO" \
            --name BCVision-2.2.0-rc5-windows \
            --dir release

      - name: Verify candidate checksums
        run: |
          cd release
          sha256sum --check SHA256SUMS.txt

      - name: Create prerelease
        run: |
          if ! gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --repo "$REPO" \
              --target f7dc201d1c224dc01c7279d153abed28eefc1496 \
              --prerelease \
              --title "BC Vision 2.2.0-rc5" \
              --notes "آزمایشی برای تست پلاک‌خوانی ویدئوی آپلودی. Windows Gate 30276736514 کامل موفق شده است: 78 تست محلی، Regression ویندوز، نصب خاموش، YOLO و EasyOCR آفلاین، آپدیت با حفظ دیتابیس و مدل‌ها."
          fi

      - name: Upload verified release files
        run: |
          gh release upload "$TAG" \
            release/BCVision_Setup_v2.2.0-rc5.exe \
            release/BCVision_Update_v2.2.0-rc5.exe \
            release/BC_Vision_v2.2.0-rc5_Source.zip \
            release/SHA256SUMS.txt \
            --repo "$REPO" \
            --clobber
