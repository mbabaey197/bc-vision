name: RC27 Hezar EXE Build

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - ".github/rc27-build-trigger.txt"

permissions:
  contents: read
  actions: write

concurrency:
  group: rc27-hezar-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: self-hosted
    timeout-minutes: 120

    env:
      PYTHONUTF8: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      BCVISION_HEZAR_OCR: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Build application with bundled Hezar OCR
        shell: cmd
        run: |
          call BUILD_PORTABLE_EXE.bat

      - name: Build installer and updater
        shell: cmd
        run: |
          set "ISCC=%ProgramFiles(x86)%\Inno Setup 6\ISCC.exe"
          if not exist "%ISCC%" set "ISCC=%ProgramFiles%\Inno Setup 6\ISCC.exe"
          if not exist "%ISCC%" (
            echo Inno Setup 6 is required on the self-hosted runner.
            exit /b 1
          )
          "%ISCC%" installer\BCVision.iss
          if errorlevel 1 exit /b 1
          "%ISCC%" installer\BCVision_Update.iss
          if errorlevel 1 exit /b 1

      - name: Upload RC27 bundle
        uses: actions/upload-artifact@v4
        with:
          name: BCVision-RC27-Hezar-Windows
          path: |
            setup_output/*.exe
            dist/BCVision/**
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
